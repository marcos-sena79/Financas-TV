<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco autorizado</title>
<style>
  :root { color-scheme: light dark; --bg: #f9f9f7; --ink: #0b0b0b; --muted: #52514e; --good: #006300; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --ink: #f0efec; --muted: #c3c2b7; --good: #0ca30c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
  h1 { color: var(--good); font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; max-width: 420px; }
</style>
</head>
<body>
  <div>
    <h1 id="title">✓ Autorização enviada</h1>
    <p id="msg">Pode fechar esta página e voltar ao terminal. O script vai confirmar quando a conexão estiver pronta.</p>
    <p id="detail" style="margin-top:12px;font-size:14px"></p>
  </div>
  <script>
    // A Pluggy pode devolver informações na URL (ex.: id da conexão ou um erro). Mostramos para facilitar o diagnóstico.
    const q = new URLSearchParams(location.search);
    const err = q.get("error") || q.get("error_description") || q.get("errorMessage");
    if (err) {
      document.getElementById("title").textContent = "✗ A autorização não foi concluída";
      document.getElementById("title").style.color = "#d03b3b";
      document.getElementById("msg").textContent = "Volte ao terminal: o script vai gerar um link novo se for preciso.";
    }
    const shown = [...q.keys()].filter((k) => !/code|token|secret/i.test(k)).map((k) => `${k}: ${q.get(k)}`);
    document.getElementById("detail").textContent = shown.length ? shown.join(" · ") : "(a Pluggy não enviou detalhes)";
  </script>
</body>
</html>
